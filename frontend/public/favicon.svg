<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="24" y1="12" x2="488" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="48%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.18" r="0.72">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1640" flood-opacity="0.24"/>
    </filter>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#glow)"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"/>
  <g filter="url(#sh)" fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <!-- RSS Beacon centered optically with stream waves below -->
    <circle cx="168" cy="178" r="40" fill="#FFFFFF" stroke="none"/>
    <path d="M 244 128 C 306 130, 354 176, 356 238" stroke-width="42"/>
    <path d="M 242 194 C 266 196, 286 216, 288 240" stroke-width="40"/>
    <!-- Two wide serene stream ripples -->
    <path d="M 96 318 C 184 276, 324 360, 416 316" stroke-width="46"/>
    <path d="M 96 400 C 184 358, 324 442, 416 398" stroke="#E0F2FE" stroke-width="46"/>
  </g>
</svg>